[build]
  # The Next app exports static HTML into out/. `npm run build` runs the
  # prebuild asset sync first, so public/ is populated from assets/images and
  # from the files extracted out of the old bundles.
  command = "npm run build"
  publish = "out"

[build.environment]
  # Next 16 requires Node 20.9+.
  NODE_VERSION = "20"

# ── Legacy URLs ──────────────────────────────────────────────────────────────
# The bundled site published five .html files, and this config used to rewrite
# clean paths onto them. Those files are no longer published, so anything that
# already links to or has bookmarked one is redirected — permanently, because
# the clean URL is the canonical one now.
[[redirects]]
  from = "/STACHE Home (standalone).html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/STACHE Work (standalone).html"
  to = "/work"
  status = 301
  force = true

[[redirects]]
  from = "/STACHE Services (standalone).html"
  to = "/services"
  status = 301
  force = true

[[redirects]]
  from = "/STACHE About (standalone).html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/STACHE Contact (standalone).html"
  to = "/contact"
  status = 301
  force = true

# /home was a clean alias for the old home page and has no route of its own now.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

# ── Caching ──────────────────────────────────────────────────────────────────
# Next fingerprints everything under /_next/static, so those are immutable.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The fonts are named rather than hashed, but they only change if the typeface
# does — and then the filename changes with it.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
