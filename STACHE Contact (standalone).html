        e.target.tagName, String(e.target.src || e.target.href || ''));

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }

    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.

        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry

    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

a href=\"#\" style=\"transition:color 0.2s ease\">LinkedIn <span data-arrow=\"\">↗<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Faside>\n\n      <div ref=\"{{ addReveal }}\" style=\"opacity:0;transform:translateY(28px);transition:opacity .8s ease .1s,transform .8s cubic-bezier(.2,.8,.2,1) .1s;border:1px solid rgba(255,255,255,0.14);border-radius:22px;padding:2rem;background:#111\">\n        <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:1rem\">\n          <div ref=\"{{ addReveal }}\" style=\"opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:0.5rem\">\n            <label for=\"name\" style=\"text-transform:uppercase;letter-spacing:0.1em;font-size:0.7rem;font-weight:900;color:#bbb\">Name *<\u002Flabel>\n            <input id=\"name\" name=\"name\" required=\"\" autocomplete=\"name\" placeholder=\"Your name\" style=\"width:100%;background:#0a0a0a;border:1px solid rgba(255,255,255,0.14);color:#f2eee5;padding:1rem 1.1rem;border-radius:14px;transition:border-color 0.2s ease,box-shadow 0.25s ease,transform 0.25s ease\" style-focus=\"transform:translateY(-1px);border-color:#ef2329;box-shadow:0 0 0 3px rgba(239,35,41,0.16)\">\n          <\u002Fdiv>\n          <div ref=\"{{ addReveal }}\" style=\"opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:0.5rem\">\n            <label for=\"email\" style=\"text-transform:uppercase;letter-spacing:0.1em;font-size:0.7rem;font-weight:900;color:#bbb\">Email *<\u002Flabel>\n            <input id=\"email\" name=\"email\" type=\"email\" required=\"\" autocomplete=\"email\" placeholder=\"you@company.com\" style=\"width:100%;background:#0a0a0a;border:1px solid rgba(255,255,255,0.14);color:#f2eee5;padding:1rem 1.1rem;border-radius:14px;transition:border-color 0.2s ease,box-shadow 0.25s ease,transform 0.25s ease\" style-focus=\"transform:translateY(-1px);border-color:#ef2329;box-shadow:0 0 0 3px rgba(239,35,41,0.16)\">\n          <\u002Fdiv>\n          <div ref=\"{{ addReveal }}\" style=\"opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:0.5rem\">\n            <label for=\"company\" style=\"text-transform:uppercase;letter-spacing:0.1em;font-size:0.7rem;font-weight:900;color:#bbb\">Company<\u002Flabel>\n            <input id=\"company\" name=\"company\" autocomplete=\"organization\" placeholder=\"Company / brand\" style=\"width:100%;background:#0a0a0a;border:1px solid rgba(255,255,255,0.14);color:#f2eee5;padding:1rem 1.1rem;border-radius:14px;transition:border-color 0.2s ease,box-shadow 0.25s ease,transform 0.25s ease\" style-focus=\"transform:translateY(-1px);border-color:#ef2329;box-shadow:0 0 0 3px rgba(239,35,41,0.16)\">\n          <\u002Fdiv>\n          <div ref=\"{{ addReveal }}\" style=\"opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:0.5rem\">\n            <label for=\"service\" style=\"text-transform:uppercase;letter-spacing:0.1em;font-size:0.7rem;font-weight:900;color:#bbb\">What do you need?<\u002Flabel>\n            <sc-raw-select id=\"service\" name=\"service\" style=\"width:100%;background:#0a0a0a;border:1px solid rgba(255,255,255,0.14);color:#f2eee5;padding:1rem 1.1rem;border-radius:14px;transition:border-color 0.2s ease,box-shadow 0.25s ease,transform 0.25s ease\" style-focus=\"transform:translateY(-1px);border-color:#ef2329;box-shadow:0 0 0 3px rgba(239,35,41,0.16)\">\n              <option>Digital marketing management<\u002Foption>\n              <option>Social consultancy<\u002Foption>\n              <option>Conceptual project execution<\u002Foption>\n              <option>Integrated campaign<\u002Foption>\n              <option>Not sure yet<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div ref=\"{{ addReveal }}\" style=\"opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:0.5rem\">\n            <label for=\"budget\" style=\"text-transform:uppercase;letter-spacing:0.1em;font-size:0.7rem;font-weight:900;color:#bbb\">Indicative budget<\u002Flabel>\n            <sc-raw-select id=\"budget\" name=\"budget\" style=\"width:100%;background:#0a0a0a;border:1px solid rgba(255,255,255,0.14);color:#f2eee5;padding:1rem 1.1rem;border-radius:14px;transition:border-color 0.2s ease,box-shadow 0.25s ease,transform 0.25s ease\" style-focus=\"transform:translateY(-1px);border-color:#ef2329;box-shadow:0 0 0 3px rgba(239,35,41,0.16)\">\n              <option>Prefer to discuss<\u002Foption>\n              <option>Under AED 50k<\u002Foption>\n              <option>AED 50k–150k<\u002Foption>\n              <option>AED 150k–500k<\u002Foption>\n              <option>AED 500k+<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div ref=\"{{ addReveal }}\" style=\"opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:0.5rem\">\n            <label for=\"timeline\" style=\"text-transform:uppercase;letter-spacing:0.1em;font-size:0.7rem;font-weight:900;color:#bbb\">Ideal timeline<\u002Flabel>\n            <input id=\"timeline\" name=\"timeline\" placeholder=\"Launch date or timeframe\" style=\"width:100%;background:#0a0a0a;border:1px solid rgba(255,255,255,0.14);color:#f2eee5;padding:1rem 1.1rem;border-radius:14px;transition:border-color 0.2s ease,box-shadow 0.25s ease,transform 0.25s ease\" style-focus=\"transform:translateY(-1px);border-color:#ef2329;box-shadow:0 0 0 3px rgba(239,35,41,0.16)\">\n          <\u002Fdiv>\n          <div ref=\"{{ addReveal }}\" style=\"opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:0.5rem;grid-column:1/-1\">\n            <label for=\"brief\" style=\"text-transform:uppercase;letter-spacing:0.1em;font-size:0.7rem;font-weight:900;color:#bbb\">Project brief *<\u002Flabel>\n            <textarea id=\"brief\" name=\"brief\" required=\"\" placeholder=\"What are you trying to achieve? Who is the audience? What needs to change?\" style=\"width:100%;background:#0a0a0a;border:1px solid rgba(255,255,255,0.14);color:#f2eee5;padding:1rem 1.1rem;border-radius:14px;min-height:180px;resize:vertical;transition:border-color 0.2s ease,box-shadow 0.25s ease\" style-focus=\"transform:translateY(-1px);border-color:#ef2329;box-shadow:0 0 0 3px rgba(239,35,41,0.16)\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <button type=\"submit\" style=\"display:inline-flex;align-items:center;justify-content:center;gap:0.7rem;border:1px solid #ef2329;background:#ef2329;border-radius:999px;padding:1rem 1.3rem;text-transform:uppercase;font-size:0.76rem;font-weight:900;letter-spacing:0.1em;color:#fff;transition:0.25s ease\" style-hover=\"background:#fff;border-color:#fff;color:#ef2329;transform:translateY(-2px);cursor:pointer\">Send project brief <span data-arrow=\"\">↗<\u002Fspan><\u002Fbutton>\n          <div role=\"status\" aria-live=\"polite\" style=\"{{ statusStyle }}\">{{ status }}<\u002Fdiv>\n        <\u002Fform>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n\n<footer style=\"padding:5rem 0 2rem;border-top:1px solid rgba(255,255,255,0.14)\">\n  <div style=\"width:min(calc(100% - 3rem),1440px);margin:auto\">\n    <div style=\"display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:3rem\">\n      <div>\n        <img src=\"c22b6e77-cafe-4c74-b8aa-95b28d769158\" alt=\"STACHE\" style=\"width:220px;margin-bottom:1.5rem\">\n        <p style=\"color:#a7a7a7\">Creative disruption meets calculated strategy. Built for brands that crave distinction — not just visibility.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h4 style=\"text-transform:uppercase;letter-spacing:0.12em;font-size:0.72rem;color:#ef2329;margin:0 0 1rem\">Navigate<\u002Fh4>\n        <a href=\"STACHE About (standalone).html\" style=\"display:block;color:#bdbdbd;margin:0.6rem 0;transition:0.2s ease\" style-hover=\"color:#f2eee5;transform:translateX(3px)\">About<\u002Fa>\n        <a href=\"STACHE Services (standalone).html\" style=\"display:block;color:#bdbdbd;margin:0.6rem 0;transition:0.2s ease\" style-hover=\"color:#f2eee5;transform:translateX(3px)\">Services<\u002Fa>\n        <a href=\"STACHE Work (standalone).html\" style=\"display:block;color:#bdbdbd;margin:0.6rem 0;transition:0.2s ease\" style-hover=\"color:#f2eee5;transform:translateX(3px)\">Work<\u002Fa>\n        <a href=\"STACHE Contact (standalone).html\" style=\"display:block;color:#bdbdbd;margin:0.6rem 0;transition:0.2s ease\" style-hover=\"color:#f2eee5;transform:translateX(3px)\">Contact<\u002Fa>\n      <\u002Fdiv>\n      <div>\n        <h4 style=\"text-transform:uppercase;letter-spacing:0.12em;font-size:0.72rem;color:#ef2329;margin:0 0 1rem\">Start a conversation<\u002Fh4>\n        <a href=\"STACHE Contact (standalone).html\" style=\"display:block;color:#bdbdbd;margin:0.6rem 0;transition:0.2s ease\" style-hover=\"color:#f2eee5;transform:translateX(3px)\">Project enquiry<\u002Fa>\n        <a href=\"mailto:hello@stache.example\" style=\"display:block;color:#bdbdbd;margin:0.6rem 0;transition:0.2s ease\" style-hover=\"color:#f2eee5;transform:translateX(3px)\">hello@stache.example<\u002Fa>\n        <a href=\"#\" style=\"display:block;color:#bdbdbd;margin:0.6rem 0;transition:0.2s ease\" style-hover=\"color:#f2eee5;transform:translateX(3px)\">Instagram ↗<\u002Fa>\n        <a href=\"#\" style=\"display:block;color:#bdbdbd;margin:0.6rem 0;transition:0.2s ease\" style-hover=\"color:#f2eee5;transform:translateX(3px)\">LinkedIn ↗<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:4rem;padding-top:1.5rem;border-top:1px solid rgba(255,255,255,0.14);display:flex;justify-content:space-between;gap:1rem;font-size:0.78rem;color:#777;flex-wrap:wrap\">\n      <span>© 2026 STACHE. All rights reserved.<\u002Fspan>\n      <span>Built to build. Designed to be impossible to ignore.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { pct: 0, y: 0, navOpen: false, scrolled: false, loaded: false, status: '' };\n  revealEls = [];\n  toggleNav = () => this.setState((st) => ({ navOpen: !st.navOpen }));\n  addReveal = (el) => {\n    if (el && !this.revealEls.includes(el)) {\n      this.revealEls.push(el);\n      // nodes mounted after the initial pass (filtered lists) still get observed\n      if (this._io) this._io.observe(el);\n    }\n  };\n  showReveal = (el) => {\n    if (el.hasAttribute && el.hasAttribute('data-rule')) {\n      el.style.transform = 'scaleX(1)';\n      return;\n    }\n    el.style.opacity = '1';\n    el.style.transform = 'none';\n  };\n  _revealAssets = () => {\n    const urls = [];\n    const logo = document.querySelector('[data-preload-logo]');\n    if (logo && (logo.currentSrc || logo.src)) urls.push(logo.currentSrc || logo.src);\n    if (this.heroSlides && this.heroSlides.length) urls.push(this.heroSlides[0].src);\n    return urls;\n  };\n  _startReveal = () => {\n    const MIN_MS = 1300;\n    const MAX_MS = 2800;\n    const urls = this._revealAssets();\n    const settled = {};\n    let pending = urls.length;\n    let minDone = false;\n    const go = () => {\n      if (this._revealed || !minDone || pending > 0) return;\n      this._revealed = true;\n      clearTimeout(this._maxTimer);\n      // paint the page at full strength while the panel still covers it\n      this.setState({ contentReady: true });\n      this._revealTimer = setTimeout(() => {\n        this.setState({ logoFlip: this.measureLogoFlip(), loaded: true });\n      }, 260);\n    };\n    urls.forEach((u, i) => {\n      const im = new Image();\n      const settle = () => {\n        if (settled[i]) return;\n        settled[i] = 1;\n        pending--;\n        go();\n      };\n      im.onload = settle;\n      im.onerror = settle;\n      im.src = u;\n      if (im.complete) settle();\n    });\n    this._minTimer = setTimeout(() => { minDone = true; go(); }, MIN_MS);\n    this._maxTimer = setTimeout(() => { minDone = true; pending = 0; go(); }, MAX_MS);\n  };\n  // The wordmark SVG is viewBox \"370 845 1265 310\" and carries this same\n  // moustache path at #0a0e1a, so its on-screen slot can be derived exactly.\n  measureMarkFlip = () => {\n    try {\n      const path = document.querySelector('[data-mark-path]');\n      const img = document.querySelector('[data-preload-logo]');\n      if (!path || !img || !path.ownerSVGElement) return null;\n      const here = path.getBoundingClientRect();\n      const box = img.getBoundingClientRect();\n      const svg = path.ownerSVGElement.getBoundingClientRect();\n      const bb = path.getBBox();\n      if (!here.width || !box.width || !bb.width) return null;\n      const VB_X = 370, VB_Y = 845, VB_W = 1265;\n      const k = box.width / VB_W;\n      const tw = bb.width * k;\n      const th = bb.height * k;\n      const tl = box.left + (bb.x - VB_X) * k;\n      const tt = box.top + (bb.y - VB_Y) * k;\n      return {\n        s: tw / here.width,\n        dx: (tl + tw / 2) - (here.left + here.width / 2),\n        dy: (tt + th / 2) - (here.top + here.height / 2),\n        ox: Math.round(here.left + here.width / 2 - svg.left),\n        oy: Math.round(here.top + here.height / 2 - svg.top),\n      };\n    } catch (err) {\n      return null;\n    }\n  };\n  markStyle = () => {\n    const f = this.state.markFlip;\n    const out = this.state.markOut;\n    const base = {\n      position: 'fixed', inset: 0, width: '100%', height: '100%',\n      zIndex: 10000, pointerEvents: 'none', willChange: 'transform, opacity',\n    };\n    if (!out) {\n      base.transform = 'none';\n      base.opacity = 1;\n      base.transition = 'transform 0.78s cubic-bezier(.62,0,.2,1), opacity 0.26s ease 0.68s';\n      return base;\n    }\n    if (!f) {\n      // fallback: dissolve in place rather than fly to an unknown slot\n      base.transform = 'scale(0.94)';\n      base.opacity = 0;\n      base.transition = 'transform 0.78s cubic-bezier(.4,0,.2,1), opacity 0.5s ease';\n      return base;\n    }\n    base.transformOrigin = f.ox + 'px ' + f.oy + 'px';\n    base.transform = 'translate(' + f.dx.toFixed(1) + 'px,' + f.dy.toFixed(1) + 'px) scale(' + f.s.toFixed(4) + ')';\n    base.opacity = 0;\n    base.transition = 'transform 0.78s cubic-bezier(.62,0,.2,1), opacity 0.26s ease 0.68s';\n    return base;\n  };\n  markPathStyle = () => ({\n    fill: this.state.markOut ? '#0a0e1a' : '#f2eee5',\n    transition: 'fill 0.34s ease 0.42s',\n  });\n  measureLogoFlip = () => {\n    try {\n      const from = document.querySelector('[data-preload-logo]');\n      const to = document.querySelector('[data-header-logo]');\n      if (!from || !to) return null;\n      const a = from.getBoundingClientRect();\n      const b = to.getBoundingClientRect();\n      if (!a.width || !b.width) return null;\n      return {\n        s: b.width / a.width,\n        dx: (b.left + b.width / 2) - (a.left + a.width / 2),\n        dy: (b.top + b.height / 2) - (a.top + a.height / 2),\n      };\n    } catch (err) {\n      return null;\n    }\n  };\n  logoStyle = () => {\n    const f = this.state.logoFlip;\n    const done = this.state.loaded;\n    const shown = this.state.markOut;\n    let t = 'translate(-50%,-50%) scale(1)';\n    if (done) {\n      t = f\n        ? 'translate(-50%,-50%) translate(' + f.dx.toFixed(1) + 'px,' + f.dy.toFixed(1) + 'px) scale(' + f.s.toFixed(4) + ')'\n        : 'translate(-50%,-50%) scale(0.82)';\n    }\n    return {\n      position: 'fixed', left: '50%', top: '50%', width: 'min(60vw,720px)',\n      zIndex: 9999, pointerEvents: 'none',\n      transform: t,\n      opacity: done ? 0 : (shown ? 1 : 0),\n      transition: done\n        ? 'transform 1.05s cubic-bezier(.62,0,.2,1), opacity 0.42s ease 0.68s'\n        : 'opacity 0.5s cubic-bezier(.4,0,.2,1) 0.22s',\n      willChange: 'transform, opacity',\n    };\n  };\n  componentDidMount() {\n    this._onScroll = () => {\n      const max = document.documentElement.scrollHeight - window.innerHeight;\n      this.setState({ scrolled: window.scrollY > 40, pct: max > 0 ? window.scrollY / max : 0, y: window.scrollY });\n    };\n    window.addEventListener('scroll', this._onScroll);\n    this._markTimer = setTimeout(() => this.setState({ markFlip: this.measureMarkFlip(), markOut: true }), 380);\n    this._startReveal();\n    this._io = new IntersectionObserver((entries) => {\n      entries.forEach((entry) => {\n        if (entry.isIntersecting) {\n          this.showReveal(entry.target);\n          this._io.unobserve(entry.target);\n        }\n      });\n    }, { threshold: 0.01, rootMargin: '0px 0px -10% 0px' });\n    requestAnimationFrame(() => {\n      this.revealEls.forEach((el) => {\n        const sibs = Array.from(el.parentElement ? el.parentElement.children : []).filter((c) => this.revealEls.includes(c));\n        const i = sibs.indexOf(el);\n        if (i > 0 && !el.style.transitionDelay) el.style.transitionDelay = Math.min(i * 0.07, 0.35) + 's';\n        this._io.observe(el);\n      });\n    });\n    this._fallback = setTimeout(() => {\n      if (!('IntersectionObserver' in window)) {\n        this.revealEls.forEach((el) => this.showReveal(el));\n        return;\n      }\n      // only settle what the viewport has already reached, so sections\n      // further down still animate when they are scrolled into view\n      this.revealEls.forEach((el) => {\n        if (el.getBoundingClientRect().top < window.innerHeight) this.showReveal(el);\n      });\n    }, 1800);\n  }\n  componentWillUnmount() {\n    window.re
