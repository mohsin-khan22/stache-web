  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

        }

    // consumers read these Blobs directly. Survives the swap like the error sink.

    for (const uuid of uuids) {

    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

anslateX(3px)\">Services<\u002Fa>\n        <a href=\"STACHE Work (standalone).html\" style=\"display:block;color:#bdbdbd;margin:0.6rem 0;transition:0.2s ease\" style-hover=\"color:#f2eee5;transform:translateX(3px)\">Work<\u002Fa>\n        <a href=\"STACHE Contact (standalone).html\" style=\"display:block;color:#bdbdbd;margin:0.6rem 0;transition:0.2s ease\" style-hover=\"color:#f2eee5;transform:translateX(3px)\">Contact<\u002Fa>\n      <\u002Fdiv>\n      <div>\n        <h4 style=\"text-transform:uppercase;letter-spacing:0.12em;font-size:0.72rem;color:#ef2329;margin:0 0 1rem\">Start a conversation<\u002Fh4>\n        <a href=\"STACHE Contact (standalone).html\" style=\"display:block;color:#bdbdbd;margin:0.6rem 0;transition:0.2s ease\" style-hover=\"color:#f2eee5;transform:translateX(3px)\">Project enquiry<\u002Fa>\n        <a href=\"mailto:hello@stache.example\" style=\"display:block;color:#bdbdbd;margin:0.6rem 0;transition:0.2s ease\" style-hover=\"color:#f2eee5;transform:translateX(3px)\">hello@stache.example<\u002Fa>\n        <a href=\"#\" style=\"display:block;color:#bdbdbd;margin:0.6rem 0;transition:0.2s ease\" style-hover=\"color:#f2eee5;transform:translateX(3px)\">Instagram ↗<\u002Fa>\n        <a href=\"#\" style=\"display:block;color:#bdbdbd;margin:0.6rem 0;transition:0.2s ease\" style-hover=\"color:#f2eee5;transform:translateX(3px)\">LinkedIn ↗<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:4rem;padding-top:1.5rem;border-top:1px solid rgba(255,255,255,0.14);display:flex;justify-content:space-between;gap:1rem;font-size:0.78rem;color:#777;flex-wrap:wrap\">\n      <span>© 2026 STACHE. All rights reserved.<\u002Fspan>\n      <span>Built to build. Designed to be impossible to ignore.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { pct: 0, y: 0, navOpen: false, scrolled: false, loaded: false };\n  revealEls = [];\n  toggleNav = () => this.setState((st) => ({ navOpen: !st.navOpen }));\n  addReveal = (el) => {\n    if (el && !this.revealEls.includes(el)) {\n      this.revealEls.push(el);\n      // nodes mounted after the initial pass (filtered lists) still get observed\n      if (this._io) this._io.observe(el);\n    }\n  };\n  showReveal = (el) => {\n    if (el.hasAttribute && el.hasAttribute('data-rule')) {\n      el.style.transform = 'scaleX(1)';\n      return;\n    }\n    el.style.opacity = '1';\n    el.style.transform = 'none';\n  };\n  _revealAssets = () => {\n    const urls = [];\n    const logo = document.querySelector('[data-preload-logo]');\n    if (logo && (logo.currentSrc || logo.src)) urls.push(logo.currentSrc || logo.src);\n    if (this.heroSlides && this.heroSlides.length) urls.push(this.heroSlides[0].src);\n    return urls;\n  };\n  _startReveal = () => {\n    const MIN_MS = 1300;\n    const MAX_MS = 2800;\n    const urls = this._revealAssets();\n    const settled = {};\n    let pending = urls.length;\n    let minDone = false;\n    const go = () => {\n      if (this._revealed || !minDone || pending > 0) return;\n      this._revealed = true;\n      clearTimeout(this._maxTimer);\n      // paint the page at full strength while the panel still covers it\n      this.setState({ contentReady: true });\n      this._revealTimer = setTimeout(() => {\n        this.setState({ logoFlip: this.measureLogoFlip(), loaded: true });\n      }, 260);\n    };\n    urls.forEach((u, i) => {\n      const im = new Image();\n      const settle = () => {\n        if (settled[i]) return;\n        settled[i] = 1;\n        pending--;\n        go();\n      };\n      im.onload = settle;\n      im.onerror = settle;\n      im.src = u;\n      if (im.complete) settle();\n    });\n    this._minTimer = setTimeout(() => { minDone = true; go(); }, MIN_MS);\n    this._maxTimer = setTimeout(() => { minDone = true; pending = 0; go(); }, MAX_MS);\n  };\n  // The wordmark SVG is viewBox \"370 845 1265 310\" and carries this same\n  // moustache path at #0a0e1a, so its on-screen slot can be derived exactly.\n  measureMarkFlip = () => {\n    try {\n      const path = document.querySelector('[data-mark-path]');\n      const img = document.querySelector('[data-preload-logo]');\n      if (!path || !img || !path.ownerSVGElement) return null;\n      const here = path.getBoundingClientRect();\n      const box = img.getBoundingClientRect();\n      const svg = path.ownerSVGElement.getBoundingClientRect();\n      const bb = path.getBBox();\n      if (!here.width || !box.width || !bb.width) return null;\n      const VB_X = 370, VB_Y = 845, VB_W = 1265;\n      const k = box.width / VB_W;\n      const tw = bb.width * k;\n      const th = bb.height * k;\n      const tl = box.left + (bb.x - VB_X) * k;\n      const tt = box.top + (bb.y - VB_Y) * k;\n      return {\n        s: tw / here.width,\n        dx: (tl + tw / 2) - (here.left + here.width / 2),\n        dy: (tt + th / 2) - (here.top + here.height / 2),\n        ox: Math.round(here.left + here.width / 2 - svg.left),\n        oy: Math.round(here.top + here.height / 2 - svg.top),\n      };\n    } catch (err) {\n      return null;\n    }\n  };\n  markStyle = () => {\n    const f = this.state.markFlip;\n    const out = this.state.markOut;\n    const base = {\n      position: 'fixed', inset: 0, width: '100%', height: '100%',\n      zIndex: 10000, pointerEvents: 'none', willChange: 'transform, opacity',\n    };\n    if (!out) {\n      base.transform = 'none';\n      base.opacity = 1;\n      base.transition = 'transform 0.78s cubic-bezier(.62,0,.2,1), opacity 0.26s ease 0.68s';\n      return base;\n    }\n    if (!f) {\n      // fallback: dissolve in place rather than fly to an unknown slot\n      base.transform = 'scale(0.94)';\n      base.opacity = 0;\n      base.transition = 'transform 0.78s cubic-bezier(.4,0,.2,1), opacity 0.5s ease';\n      return base;\n    }\n    base.transformOrigin = f.ox + 'px ' + f.oy + 'px';\n    base.transform = 'translate(' + f.dx.toFixed(1) + 'px,' + f.dy.toFixed(1) + 'px) scale(' + f.s.toFixed(4) + ')';\n    base.opacity = 0;\n    base.transition = 'transform 0.78s cubic-bezier(.62,0,.2,1), opacity 0.26s ease 0.68s';\n    return base;\n  };\n  markPathStyle = () => ({\n    fill: this.state.markOut ? '#0a0e1a' : '#f2eee5',\n    transition: 'fill 0.34s ease 0.42s',\n  });\n  measureLogoFlip = () => {\n    try {\n      const from = document.querySelector('[data-preload-logo]');\n      const to = document.querySelector('[data-header-logo]');\n      if (!from || !to) return null;\n      const a = from.getBoundingClientRect();\n      const b = to.getBoundingClientRect();\n      if (!a.width || !b.width) return null;\n      return {\n        s: b.width / a.width,\n        dx: (b.left + b.width / 2) - (a.left + a.width / 2),\n        dy: (b.top + b.height / 2) - (a.top + a.height / 2),\n      };\n    } catch (err) {\n      return null;\n    }\n  };\n  logoStyle = () => {\n    const f = this.state.logoFlip;\n    const done = this.state.loaded;\n    const shown = this.state.markOut;\n    let t = 'translate(-50%,-50%) scale(1)';\n    if (done) {\n      t = f\n        ? 'translate(-50%,-50%) translate(' + f.dx.toFixed(1) + 'px,' + f.dy.toFixed(1) + 'px) scale(' + f.s.toFixed(4) + ')'\n        : 'translate(-50%,-50%) scale(0.82)';\n    }\n    return {\n      position: 'fixed', left: '50%', top: '50%', width: 'min(60vw,720px)',\n      zIndex: 9999, pointerEvents: 'none',\n      transform: t,\n      opacity: done ? 0 : (shown ? 1 : 0),\n      transition: done\n        ? 'transform 1.05s cubic-bezier(.62,0,.2,1), opacity 0.42s ease 0.68s'\n        : 'opacity 0.5s cubic-bezier(.4,0,.2,1) 0.22s',\n      willChange: 'transform, opacity',\n    };\n  };\n  componentDidMount() {\n    this._onScroll = () => {\n      const max = document.documentElement.scrollHeight - window.innerHeight;\n      this.setState({ scrolled: window.scrollY > 40, pct: max > 0 ? window.scrollY / max : 0, y: window.scrollY });\n    };\n    window.addEventListener('scroll', this._onScroll);\n    this._markTimer = setTimeout(() => this.setState({ markFlip: this.measureMarkFlip(), markOut: true }), 380);\n    this._startReveal();\n    this._io = new IntersectionObserver((entries) => {\n      entries.forEach((entry) => {\n        if (entry.isIntersecting) {\n          this.showReveal(entry.target);\n          this._io.unobserve(entry.target);\n        }\n      });\n    }, { threshold: 0.01, rootMargin: '0px 0px -10% 0px' });\n    requestAnimationFrame(() => {\n      this.revealEls.forEach((el) => {\n        const sibs = Array.from(el.parentElement ? el.parentElement.children : []).filter((c) => this.revealEls.includes(c));\n        const i = sibs.indexOf(el);\n        if (i > 0 && !el.style.transitionDelay) el.style.transitionDelay = Math.min(i * 0.07, 0.35) + 's';\n        this._io.observe(el);\n      });\n    });\n    this._fallback = setTimeout(() => {\n      this.revealEls.forEach((el) => this.showReveal(el));\n    }, 1800);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n    clearTimeout(this._timer);\n    clearTimeout(this._minTimer);\n    clearTimeout(this._maxTimer);\n    clearTimeout(this._revealTimer);\n    clearTimeout(this._markTimer);\n    clearTimeout(this._fallback);\n    if (this._io) this._io.disconnect();\n  }\n  renderVals() {\n    return {\n      addReveal: this.addReveal,\n      mobileNavStyle: {\n        position: 'fixed', inset: 0, background: '#050505', zIndex: 895,\n        flexDirection: 'column', alignItems: 'flex-start', justifyContent: 'center',\n        padding: '2rem', gap: '1.1rem',\n        transform: this.state.navOpen ? 'none' : 'translateY(-105%)',\n        transition: '0.5s cubic-bezier(.77,0,.18,1)',\n      },\n      menuIcon: this.state.navOpen ? '✕' : '☰',\n      toggleNav: this.toggleNav,\n\n      progressStyle: {\n        position: 'fixed', left: 0, top: 0, height: '3px', background: '#ef2329',\n        width: (this.state.pct * 100).toFixed(2) + '%', zIndex: 1000, transition: 'width 0.1s linear',\n      },\n      preloaderStyle: {\n        position: 'fixed', inset: 0, background: '#ef2329', zIndex: 9998,\n        display: 'grid', placeItems: 'center',\n        opacity: this.state.loaded ? 0 : 1,\n        transition: 'opacity 0.95s cubic-bezier(.4,0,.2,1)',\n        pointerEvents: this.state.loaded ? 'none' : 'auto',\n        willChange: 'opacity',\n      },\n      preloaderLogoStyle: this.logoStyle(),\n      preloaderMarkStyle: this.markStyle(),\n      preloaderMarkPathStyle: this.markPathStyle(),\n      headerStyle: {\n        position: 'fixed', top: 0, left: 0, right: 0, zIndex: 900,\n        padding: this.state.scrolled ? '0.9rem 0' : '1.1rem 0',\n        background: this.state.scrolled ? 'rgba(5,5,5,0.82)' : 'rgba(5,5,5,0.4)',\n        backdropFilter: 'blur(14px)',\n        borderBottom: this.state.scrolled ? '1px solid rgba(255,255,255,0.14)' : '1px solid rgba(255,255,255,0.05)',\n        transition: '0.3s ease',\n      },\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<script>(function () {\n  var wait = setInterval(function () {\n    var logo = document.querySelector('[data-preload-logo]');\n    var panel = null, divs = document.querySelectorAll('div');\n    for (var i = 0; i < divs.length; i++) {\n      var cs = getComputedStyle(divs[i]);\n      if (cs.position === 'fixed' && cs.zIndex === '9998') { panel = divs[i]; break; }\n    }\n    if (logo && panel && logo.style.opacity === '0') { clearInterval(wait); startScroll(); }\n  }, 50);\n  function startScroll() {\n    var y = 0;\n    var step = setInterval(function () {\n      y += Math.round(window.innerHeight * 0.5);\n      window.scrollTo(0, y);\n      if (y > document.documentElement.scrollHeight + window.innerHeight) {\n        clearInterval(step);\n        setTimeout(audit, 1500);\n      }\n    }, 70);\n  }\n  function audit() {\n    var unrevealed = [];\n    var revealed = 0;\n    // reveal targets are the ones the template gave an inline opacity:0 to\n    var all = document.querySelectorAll('main *, aside');\n    for (var i = 0; i < all.length; i++) {\n      var el = all[i];\n      var a = el.getAttribute('style') || '';\n      if (!/opacity/.test(a)) continue;\n      if (el.hasAttribute('data-rule')) continue;\n      if (el.style.opacity === '1') revealed++;\n      else unrevealed.push(el.tagName + '(' + el.style.opacity + ')');\n    }\n    var rules = document.querySelectorAll('[data-rule]');\n    var rulesGrown = 0, rulesFlat = [];\n    for (var j = 0; j < rules.length; j++) {\n      if (rules[j].style.transform === 'scaleX(1)') rulesGrown++;\n      else rulesFlat.push(rules[j].style.transform || 'unset');\n    }\n    document.title = 'AUDIT revealed=' + revealed + ' unrevealed=' + unrevealed.length\n      + (unrevealed.length ? '[' + unrevealed.slice(0, 8).join(',') + ']' : '')\n      + ' | rules ' + rulesGrown + '/' + rules.length\n      + (rulesFlat.length ? ' flat[' + rulesFlat.join(',') + ']' : '')\n      + ' | docH=' + document.documentElement.scrollHeight;\n  }\n})();<\u002Fscript><\u002Fbody><\u002Fhtml>"
